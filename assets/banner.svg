<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="neon-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>

    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.75; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.65; }
    }
    @keyframes syncFlow {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillRev {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(7px); }
    }
    .orb-anim-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-anim-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .sync-line { stroke-dasharray: 8 6; animation: syncFlow 4s linear infinite; }
    .cursor-1 { animation: blinkCursor 1s infinite; }
    .cursor-2 { animation: blinkCursor 1.2s infinite; }
    .pill-float-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-float-2 { animation: floatPillRev 6s ease-in-out infinite; }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Overlay Pattern (Background) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Glowing Dynamic Ambience Orbs (Behind content) -->
  <circle cx="180" cy="120" r="140" fill="#00f2fe" filter="url(#soft-blur)" class="orb-anim-1" />
  <circle cx="1020" cy="280" r="160" fill="#7f00ff" filter="url(#soft-blur)" class="orb-anim-2" />
  <circle cx="600" cy="380" r="110" fill="#3b82f6" filter="url(#soft-blur)" opacity="0.3" />

  <!-- Animated Synchronizing Data Flows (Behind Foreground Content) -->
  <path d="M 80 340 C 300 370, 420 310, 600 330 C 780 350, 920 310, 1120 350" fill="none" stroke="#38bdf8" stroke-width="2.5" class="sync-line" opacity="0.4" />
  <path d="M 120 70 C 320 40, 500 90, 720 50 C 900 20, 1000 80, 1100 60" fill="none" stroke="#a855f7" stroke-width="2" class="sync-line" opacity="0.3" />

  <!-- Outer Rounded Border -->
  <rect width="1196" height="416" x="2" y="2" rx="15" fill="none" stroke="url(#neon-cyan-blue)" stroke-width="2" opacity="0.65" />

  <!-- Code Sync Dynamic Card Left (Developer Node 1) -->
  <g class="pill-float-1" transform="translate(60, 260)">
    <rect width="210" height="96" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#subtle-shadow)" />
    <circle cx="20" cy="20" r="5" fill="#ef4444" />
    <circle cx="36" cy="20" r="5" fill="#f59e0b" />
    <circle cx="52" cy="20" r="5" fill="#10b981" />
    <text x="70" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">peer-1 (local)</text>
    <text x="20" y="52" font-family="'Courier New', monospace" font-size="12" fill="#38bdf8">const state = sync()</text>
    <rect x="162" y="41" width="2" height="14" fill="#00f2fe" class="cursor-1" />
    <text x="20" y="74" font-family="'Courier New', monospace" font-size="11" fill="#64748b">&gt;&gt; CRDT.merge(patch)</text>
  </g>

  <!-- Code Sync Dynamic Card Right (Developer Node 2) -->
  <g class="pill-float-2" transform="translate(930, 260)">
    <rect width="210" height="96" rx="10" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2" filter="url(#subtle-shadow)" />
    <circle cx="20" cy="20" r="5" fill="#ef4444" />
    <circle cx="36" cy="20" r="5" fill="#f59e0b" />
    <circle cx="52" cy="20" r="5" fill="#10b981" />
    <text x="70" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">peer-2 (remote)</text>
    <text x="20" y="52" font-family="'Courier New', monospace" font-size="12" fill="#c084fc">applyUpdate(update)</text>
    <rect x="156" y="41" width="2" height="14" fill="#e879f9" class="cursor-2" />
    <text x="20" y="74" font-family="'Courier New', monospace" font-size="11" fill="#10b981">● 0ms latency sync</text>
  </g>

  <!-- FOREGROUND: Main Title and Headings (High Contrast, Centered, Crisp) -->
  <g id="foreground-content">
    <!-- Super-category badge -->
    <rect x="445" y="42" width="310" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="600" y="61" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">⚡ REAL-TIME MULTIPLAYER DEVTOOLS</text>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Code Synchronization
    </text>
    <text x="600" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" fill="url(#neon-cyan-blue)" letter-spacing="-0.2">
      &amp; Pair Programming
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1">
      Curated Ecosystem of SaaS Platforms, CRDT Engines &amp; Open-Source Multiplayer Tooling
    </text>

    <!-- Category Feature Badges / Pills in Foreground -->
    <g transform="translate(290, 252)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="28" rx="14" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
      <text x="67" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">💻 Multiplayer IDEs</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="165" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
      <text x="227" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c084fc">🔄 CRDT &amp; OT Protocols</text>

      <!-- Pill 3 -->
      <rect x="320" y="0" width="145" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="392" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399">🖥️ Terminal Sharing</text>

      <!-- Pill 4 -->
      <rect x="475" y="0" width="145" height="28" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="547" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">🚀 Low-Latency Audio</text>
    </g>
  </g>
</svg>